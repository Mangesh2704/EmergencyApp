<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Chatbot</title>
    <style>
        #suggestions {
            margin-top: 10px;
            padding: 0;
            list-style-type: none;
        }

        #suggestions li {
            padding: 5px;
            cursor: pointer;
        }

        #suggestions li:hover {
            background-color: #e0e0e0;
        }

        .outerbox {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url('bgEmg.png');
            background-size: cover;
            /* Ensures the image covers the entire div */
            background-position: center;
            /* Centers the image within the div */
            background-repeat: no-repeat;
            /* Prevents image repetition */
            border: none;
            /* Optional border */
            background-color: green;
        }

        body {}

        .innerBox {
            background-image: url('image.png');
            background-size: cover;
            /* Ensures the image covers the entire div */
            background-position: center;
            /* Centers the image within the div */
            background-repeat: no-repeat;
            /* Prevents image repetition */
            border: 1px solid #ddd;
            /* Optional border */
            background-color: green;
            border: none;
            -webkit-box-shadow: 0px 0px 40px 7px rgba(255, 13, 13, 1);
            -moz-box-shadow: 0px 0px 40px 7px rgba(255, 13, 13, 1);
            box-shadow: 0px 0px 40px 7px rgba(255, 13, 13, 1);




        }
    </style>
</head>

<body style="background-color: gainsboro; ">
    <div class="outerbox" style="background-color: gainsboro;">



        <div class="w-full max-w-xs p-5 bg-gray-100 rounded-lg font-mono innerBox">
            <div class="">
                <button
                    class="text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-500/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('police')">
                    Police
                </button>
                <button
                    class="text-white bg-gradient-to-r from-red-500 via-red-600 to-red-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 shadow-lg shadow-red-500/50 dark:shadow-lg dark:shadow-red-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('ambulance')">
                    Ambulance
                </button>
                <button
                    class="text-white bg-gradient-to-r from-blue-400 via-blue-500 to-blue-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-400/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('fire')">
                    Fire
                </button>
                <button
                    class="text-white bg-gradient-to-r from-pink-500 via-pink-600 to-pink-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-pink-300 dark:focus:ring-pink-800 shadow-lg shadow-pink-500/50 dark:shadow-lg dark:shadow-pink-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('womenSafety')">
                    Women Safety
                </button>
                <button
                    class="text-white bg-gradient-to-r from-pink-500 via-pink-600 to-pink-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-pink-300 dark:focus:ring-pink-800 shadow-lg shadow-pink-500/50 dark:shadow-lg dark:shadow-pink-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('cyberSafety')">
                    Cyber Safety
                </button>
                <button
                    class="text-white bg-gradient-to-r from-blue-400 via-blue-500 to-blue-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 shadow-lg shadow-blue-400/50 dark:shadow-lg dark:shadow-blue-800/80 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2"
                    type="button" onclick="selectOption('childSafety')">
                    Child S
                </button>
            </div>

            <label class="block text-white  text-center font-bold mb-2" for="userInput">Search</label>
            <input
                class="text-sm custom-input w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm transition duration-300 ease-in-out transform focus:-translate-y-1 focus:outline-blue-300 hover:shadow-lg hover:border-blue-300 bg-gray-100"
                type="text" id="userInput" placeholder="Type something..." onkeyup="getSuggestions()" />
            <ul id="suggestions"></ul>
        </div>


    </div>

    <script>
        async function getSuggestions() {
            const userInput = document.getElementById('userInput').value;
            if (userInput) {
                try {
                    const response = await fetch('http://localhost:3000/suggest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ input: userInput })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log("------------------")
                        console.log("all suggestions:" + data.suggestions);
                        console.log("------------------")
                        showSuggestions(data.suggestions);
                    } else {
                        console.error('Failed to fetch suggestions:', response.statusText);
                        document.getElementById('suggestions').innerHTML = '';
                    }
                } catch (error) {
                    console.error('Error parsing suggestions:', error);
                    document.getElementById('suggestions').innerHTML = '';
                }
            } else {
                document.getElementById('suggestions').innerHTML = '';
            }
        }

        function showSuggestions(suggestions) {
            const suggestionsList = document.getElementById('suggestions');
            suggestionsList.innerHTML = '';
            suggestions.forEach(suggestion => {
                const li = document.createElement('li');
                li.textContent = suggestion;
                li.onclick = () => selectOption(suggestion);
                suggestionsList.appendChild(li);
            });
        }


        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                } else {
                    reject(new Error("Geolocation is not supported by this browser."));
                }
            });
        }
        async function selectOption(option) {
            alert(option);
            const position = await getGeolocation();
            // Use the geolocation data
            const { latitude, longitude } = position.coords;

            // Proceed with other tasks using the geolocation data
            const userLocation = `Latitude: ${latitude}, Longitude: ${longitude}`;

            console.log("Out navigator");

            console.log("2" + userLocation);
            try {


                const response = await fetch('http://localhost:3000/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ option, userLocation })
                });

            } catch (error) {
                console.error('Error parsing suggestions:', error);
            }
        }


    </script>
</body>

</html>
